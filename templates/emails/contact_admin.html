{% extends "emails/base_email.html" %}
{% block title %}Aloqa xabari{% endblock %}
{% block content %}
<h1 style="margin:0 0 12px;font-size:20px;">Yangi aloqa xabari</h1>
<p><strong>Ism:</strong> {{ name }}</p>
<p><strong>{% if is_email %}Email{% else %}Telefon{% endif %}:</strong> {{ contact }}</p>
<p><strong>Xabar:</strong></p>
<p style="padding:12px;background:#f8fafc;border-radius:10px;">{{ message }}</p>
{% endblock %}
