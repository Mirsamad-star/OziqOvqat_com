{% load socialaccount %}
<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ro‘yxatdan o‘tish — OziqMarket</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Plus Jakarta Sans',sans-serif;min-height:100vh;background:linear-gradient(135deg,#ecfdf5,#f0fdf4);display:flex;align-items:center;justify-content:center;padding:20px}
.wrap{width:100%;max-width:460px}
.logo{text-align:center;font-size:1.8rem;font-weight:800;color:#16a34a;margin-bottom:24px}
.logo span{color:#0f172a}
.card{background:#fff;padding:36px;border-radius:22px;box-shadow:0 20px 50px rgba(0,0,0,.08)}
.card h1{font-size:1.6rem;margin-bottom:6px}
.card>p{color:#64748b;margin-bottom:24px}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-weight:700;color:#374151;margin-bottom:6px;font-size:.9rem}
.form-group input{width:100%;padding:13px 14px;border:1px solid #e2e8f0;border-radius:12px;font:inherit;outline:none;transition:.2s}
.form-group input:focus{border-color:#16a34a;box-shadow:0 0 0 3px rgba(22,163,74,.12)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn{width:100%;padding:14px;background:#16a34a;color:#fff;border:none;border-radius:12px;font-size:1rem;font-weight:700;cursor:pointer;transition:.2s}
.btn:hover{background:#15803d}
.msg{padding:12px;border-radius:10px;margin-bottom:16px;font-size:.9rem}
.msg.error{background:#fef2f2;color:#dc2626}
.msg.success{background:#f0fdf4;color:#15803d}
.divider{display:flex;align-items:center;gap:12px;margin:20px 0;color:#94a3b8;font-size:.85rem}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:#e2e8f0}
.social a{display:block;text-decoration:none;margin-bottom:10px}
.social button{width:100%;height:48px;border-radius:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;font-size:.95rem;font-weight:700;border:1px solid #e2e8f0;background:#fff;transition:.2s}
.social button:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,0,0,.08)}
.links{text-align:center;margin-top:20px;color:#64748b;font-size:.9rem}
.links a{color:#16a34a;font-weight:700}
.back{display:block;text-align:center;margin-top:14px;color:#64748b;font-size:.85rem}
@media(max-width:500px){.row{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">Oziq<span>Market</span> 🥗</div>
  <div class="card">
    <h1>Ro‘yxatdan o‘tish</h1>
    <p>Yangi hisob yarating</p>
    {% if messages %}{% for m in messages %}<div class="msg {% if 'error' in m.tags %}error{% else %}success{% endif %}">{{ m }}</div>{% endfor %}{% endif %}
    <form method="post" action="{% url 'register' %}">
      {% csrf_token %}
      <div class="form-group"><label>Login *</label><input type="text" name="username" required autofocus placeholder="username"></div>
      <div class="form-group"><label>Email</label><input type="email" name="email" placeholder="email@example.com"></div>
      <div class="row">
        <div class="form-group"><label>Parol *</label><input type="password" name="password" required minlength="6" placeholder="min 6 belgi"></div>
        <div class="form-group"><label>Parolni takrorlang</label><input type="password" name="password2" placeholder="qayta kiriting"></div>
      </div>
      <button type="submit" class="btn">Ro‘yxatdan o‘tish</button>
    </form>
    <div class="divider">yoki</div>
    <div class="social">
      <a href="{% provider_login_url 'google' %}"><button type="button">🔵 Google orqali</button></a>
      <a href="{% provider_login_url 'github' %}"><button type="button" style="background:#0f172a;color:#fff;border-color:#0f172a">GitHub orqali</button></a>
    </div>
    <div class="links">Allaqachon hisobingiz bormi? <a href="/login/">Kirish</a></div>
    <a href="/" class="back">← Bosh sahifa</a>
  </div>
</div>

<script>
(function(){
const translations={
uz:{'Home':'Bosh sahifa','Menu':'Menyu','Sale':'Chegirmalar','Like':'Yoqtirganlar','About':'Biz haqimizda','Contact':'Aloqa','Login':'Kirish','Register':'Ro‘yxatdan o‘tish','Cart':'Savat','Menu':'Menyu','Sale':'Chegirmalar','AI':'AI yordamchi','Like':'Yoqtirganlar','Retsept':'Retseptlar','Game':'O‘yin','About':'Biz haqimizda','Contact':'Aloqa','Login':'Kirish','Register':'Ro‘yxatdan o‘tish','Cart':'Savat','Bosh sahifa':'Bosh sahifa','Savat':'Savat','Kirish':'Kirish','Ro‘yxat':'Ro‘yxatdan o‘tish','Mahsulotlar':'Mahsulotlar','Add to cart':'Savatga qo‘shish','+ Savat':'+ Savat','Search':'Qidirish','Search products':'Mahsulot qidirish','Product not found':'Mahsulot topilmadi'},
ru:{'Home':'Главная','Menu':'Меню','Sale':'Скидки','Like':'Избранное','About':'О нас','Contact':'Контакты','Login':'Войти','Register':'Регистрация','Cart':'Корзина','Bosh sahifa':'Главная','Menyu':'Меню','Chegirmalar':'Скидки','AI yordamchi':'ИИ-помощник','Yoqtirganlar':'Избранное','Retseptlar':'Рецепты','O‘yin':'Игра','Biz haqimizda':'О нас','Aloqa':'Контакты','Kirish':'Войти','Ro‘yxatdan o‘tish':'Регистрация','Savat':'Корзина','Mahsulotlar':'Товары','Savatga qo‘shish':'В корзину','+ Savat':'+ В корзину','Qidirish':'Поиск','Mahsulot qidirish':'Поиск товаров','Mahsulot topilmadi':'Товары не найдены','Tez yetkazish':'Быстрая доставка','Yangi mahsulot':'Свежие продукты','Yuborish':'Отправить','Sharhlar':'Отзывы','Narx':'Цена'},
en:{'Home':'Home','Menu':'Menu','Sale':'Sale','Like':'Favorites','About':'About','Contact':'Contact','Login':'Login','Register':'Register','Cart':'Cart','Bosh sahifa':'Home','Menyu':'Menu','Chegirmalar':'Sale','AI yordamchi':'AI Assistant','Yoqtirganlar':'Favorites','Retseptlar':'Recipes','O‘yin':'Game','Biz haqimizda':'About','Aloqa':'Contact','Kirish':'Login','Ro‘yxatdan o‘tish':'Register','Savat':'Cart','Mahsulotlar':'Products','Savatga qo‘shish':'Add to cart','+ Savat':'+ Add to cart','Qidirish':'Search','Mahsulot qidirish':'Search products','Mahsulot topilmadi':'No products found','Tez yetkazish':'Fast delivery','Yangi mahsulot':'Fresh products','Yuborish':'Submit','Sharhlar':'Reviews','Narx':'Price'}
};
const imageMap=[
[/oreo|pechen.*oreo|oreo.*pechen/i,'photo-1587049352851-8d4e89133924'],
[/pichen|pechen|печень|cookie|biscuit|печенье/i,'photo-1499636136210-6f4ee915583e'],
[/vafli|waffle|вафл/i,'photo-1562376552-0d160a2f238d'],
[/keks|muffin|cupcake|маффин/i,'photo-1607958996333-41aef7caefaa'],
[/shokolad|chocolate|шоколад/i,'photo-1511381939415-e44015466834'],
[/tort|cake|пирог/i,'photo-1578985545062-69928b1dafee'],
[/konfet|candy|karamel|карамел|конфет/i,'photo-1581798459219-318e76aecc7b'],
[/chips|chipsi|чипс/i,'photo-1566478989037-eec170784d0b'],
[/muzqaymoq|ice.?cream|морожен/i,'photo-1563805042-7684c019e1cb'],
[/olma|apple|яблок/i,'photo-1560806887-1e4cd0b6cbd6'],
[/banan|banana|банан/i,'photo-1571771894821-ce9b6c11b08e'],
[/apelsin|orange|mandarin|апельсин|мандарин/i,'photo-1547514701-42782101795e'],
[/uzum|grape|виноград/i,'photo-1537640538966-79f369143f8f'],
[/pomidor|tomato|томат/i,'photo-1546094096-0df4bcaaa337'],
[/sabzi|carrot|морковь/i,'photo-1445282768818-728615cc910a'],
[/non|bread|baget|хлеб/i,'photo-1509440159596-0249088772ff'],
[/sut|milk|qatiq|yogurt|молок|йогурт/i,'photo-1550583724-b2692b85b150'],
[/go.sht|meat|mol|tovuq|chicken|мясо|куриц/i,'photo-1607623814075-e51df1bdc82f'],
[/pishloq|cheese|сыр/i,'photo-1486297678162-eb2a19b0a32d'],
[/tuxum|egg|яйц/i,'photo-1506976785307-8732e854ad03'],
[/suv|water|ichimlik|juice|вода|сок/i,'photo-1548839140-29a749e1cf4d'],
[/sabzavot|vegetable|salat|ko.kat|овощ/i,'photo-1540420773420-3366772f4999'],
[/meva|fruit|фрукт/i,'photo-1610832958506-aa56368176cf']
];
const photo=id=>'https://images.unsplash.com/'+id+'?auto=format&fit=crop&w=800&q=82';
window.OZIQ_IMAGES={fallback:photo('photo-1542838132-92c53300491e')};
document.querySelectorAll('img[data-product-image]').forEach(img=>{
 const text=(img.dataset.productImage||'')+' '+(img.dataset.category||'');
 const found=imageMap.find(x=>x[0].test(text));
 img.src=photo(found?found[1]:'photo-1542838132-92c53300491e');
 img.onerror=()=>{img.onerror=null;img.src=window.OZIQ_IMAGES.fallback};
});
let lang=localStorage.getItem('oziq-lang')||'uz';
function applyLanguage(){
 document.documentElement.lang=lang;
 const dict=translations[lang]||translations.uz;
 // Translate exact standalone text nodes, preserving Django-rendered product/user data.
 const walker=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);
 const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);
 nodes.forEach(n=>{if(!n.parentElement||['SCRIPT','STYLE','TEXTAREA','INPUT'].includes(n.parentElement.tagName))return;
  const raw=n.nodeValue,trim=raw.trim(); if(dict[trim]) n.nodeValue=raw.replace(trim,dict[trim]);
 });
 document.querySelectorAll('[data-lang-select]').forEach(el=>el.value=lang);
}
window.oziqSetLanguage=function(value){lang=value;localStorage.setItem('oziq-lang',lang);location.reload()};
document.addEventListener('DOMContentLoaded',()=>{
 let holder=document.querySelector('[data-lang-select]');
 if(!holder){
  holder=document.createElement('select');holder.setAttribute('data-lang-select','');holder.setAttribute('aria-label','Language');
  holder.innerHTML='<option value="uz">🇺🇿 UZ</option><option value="ru">🇷🇺 RU</option><option value="en">🇬🇧 EN</option>';
  holder.style.cssText='padding:8px 10px;border-radius:12px;border:1px solid #cbd5e1;background:var(--card,#fff);color:var(--text,#0f172a);font:inherit;cursor:pointer';
  const nav=document.querySelector('.nav-inner'); if(nav)nav.appendChild(holder);
 }
 holder.value=lang;holder.addEventListener('change',e=>window.oziqSetLanguage(e.target.value));
 applyLanguage();
});
})();
</script>

</body>
</html>
