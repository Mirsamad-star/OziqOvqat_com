<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Parolni tiklash — Oziq Ovqat</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:#f8faf9;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:#fff;border-radius:20px;padding:36px 32px;width:min(420px,100%);box-shadow:0 10px 40px rgba(15,23,42,.08)}
.logo{font-size:1.4rem;font-weight:800;color:#16a34a;text-align:center;margin-bottom:8px}
.logo span{color:#0f172a}
h1{font-size:1.25rem;text-align:center;margin-bottom:8px}
p{color:#64748b;font-size:.9rem;text-align:center;margin-bottom:24px;line-height:1.5}
label{display:block;font-weight:700;font-size:.9rem;margin-bottom:6px;color:#374151}
input{width:100%;padding:13px 14px;border:1px solid #e2e8f0;border-radius:12px;font:inherit;outline:none;transition:.2s}
input:focus{border-color:#16a34a;box-shadow:0 0 0 3px rgba(22,163,74,.12);transform:translateY(-1px)}
button{width:100%;margin-top:18px;padding:14px;background:#16a34a;color:#fff;border:none;border-radius:12px;font-weight:700;font-size:1rem;cursor:pointer;transition:.25s}
button:hover{background:#15803d;transform:translateY(-2px);box-shadow:0 8px 20px rgba(22,163,74,.3)}
button:active{transform:scale(.98)}
.back{display:block;text-align:center;margin-top:16px;color:#16a34a;font-weight:600;text-decoration:none;font-size:.9rem}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="card">
  <div class="logo">Oziq<span>Market</span></div>
  <h1>Parolni unutdingizmi?</h1>
  <p>Email manzilingizni kiriting — tiklash havolasini yuboramiz.</p>
  <form method="post">
    {% csrf_token %}
    <label for="id_email">Email</label>
    <input type="email" name="email" id="id_email" required placeholder="email@example.com" autocomplete="email">
    <button type="submit">Havola yuborish</button>
  </form>
  <a class="back" href="{% url 'login' %}">← Login sahifasiga qaytish</a>
</div>
</body>
</html>
